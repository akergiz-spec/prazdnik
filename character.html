<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказать персонажа на праздник в Нижнем Новгороде</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');
  
  :root {
    --primary: #0b6fa4;
    --accent: #ff7a1a;
    --accent-gradient: linear-gradient(135deg, #ff8c2b 0%, #ff5e00 100%);
    --bg-light: #f0f7fb;
    --text-main: #1a202c;
    --text-muted: #64748b;
  }

  @keyframes bgAnimation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  body { 
    font-family: 'Montserrat', sans-serif; 
    margin: 0; padding: 0; 
    background-color: #f0f7fb;
    background-image: radial-gradient(#d0e8f7 2px, transparent 2px), radial-gradient(#d0e8f7 2px, transparent 2px);
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
    color: var(--text-main); 
    text-align: center; 
    overflow-x: hidden;
  }

  header { 
    background: rgba(255, 255, 255, 0.85); 
    backdrop-filter: blur(15px);
    padding: 15px 30px; 
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
  }
  
  .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 10px; }
  
  .back-btn { 
    color: var(--primary); text-decoration: none; font-weight: 600; font-size: 15px; 
    display: flex; align-items: center; gap: 5px; transition: 0.3s;
  }
  .back-btn:hover { color: var(--accent); transform: translateX(-5px); }

  .container { max-width: 900px; margin: 0 auto; padding: 30px 15px; }
  
  .hero { 
    background: rgba(255, 255, 255, 0.98); 
    padding: 40px 25px; 
    border-radius: 30px; 
    box-shadow: 0 30px 60px -15px rgba(11, 111, 164, 0.15); 
    margin-bottom: 40px; 
    border: 1px solid rgba(255, 255, 255, 0.9);
  }

  h1 { color: var(--primary); font-size: 42px; margin: 0 0 15px 0; line-height: 1.15; font-weight: 900; }
  .description { color: var(--text-muted); font-size: 18px; margin-bottom: 30px; line-height: 1.6; }
  
  /* Сетка галереи */
  .gallery { 
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 15px; 
    margin-bottom: 30px; 
  }
  
  .gallery img, .gallery video { 
    width: 100%; 
    aspect-ratio: 1 / 1; 
    object-fit: cover; 
    border-radius: 16px; 
    box-shadow: 0 5px 15px rgba(0,0,0,0.08); 
    transition: transform 0.3s ease;
    cursor: pointer;
  }

  .gallery img:hover, .gallery video:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(11, 111, 164, 0.2);
  }

  .btn-call { 
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; max-width: 400px; padding: 20px 30px; border-radius: 50px; 
    font-size: 20px; font-weight: 900; text-decoration: none; 
    background: var(--accent-gradient); color: white; 
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 15px 30px rgba(255, 94, 0, 0.3);
  }
  .btn-call:hover { transform: translateY(-5px) scale(1.03); box-shadow: 0 20px 40px rgba(255, 94, 0, 0.5); }

  /* Стили для лайтбокса (увеличение фото) */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9);
    z-index: 9999;
    justify-content: center;
    align-items: center;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 95%; max-height: 95%;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: zoomIn 0.3s ease;
  }
  .lightbox-close {
    position: absolute; top: 20px; right: 20px;
    color: white; font-size: 50px; cursor: pointer;
    font-weight: bold; line-height: 1;
  }
  @keyframes zoomIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 600px) {
    .container { padding: 15px 10px; }
    .hero { padding: 25px 15px; border-radius: 20px; margin-bottom: 20px; }
    h1 { font-size: 26px; }
    .description { font-size: 14px; margin-bottom: 20px; }
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .gallery img, .gallery video { border-radius: 12px; }
    .btn-call { font-size: 16px; padding: 16px 15px; max-width: 100%; }
    .back-btn { font-size: 13px; }
    .logo { font-size: 18px; }
    header { padding: 15px 10px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">🐻 ПраздникНН</a>
  <a href="index.html" class="back-btn">← Назад на главную</a>
</header>

<div class="container">
  <div class="hero">
    <h1 id="char-name">Загрузка...</h1>
    <p class="description" id="char-desc">Пожалуйста, подождите...</p>
    
    <div class="gallery" id="char-gallery">
    </div>

    <a href="tel:+79085997498" class="btn-call">📞 Заказать этого персонажа</a>
  </div>
</div>

<!-- Само окно для увеличенного фото -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
  // База данных персонажей
  const characters = {
    'bear': {
      name: 'Белый медведь',
      desc: 'Огромный, мягкий и невероятно обнимательный белый медведь! Он обожает танцевать, играть с детьми и делать потрясающие фото. Идеальный герой для дня рождения, Нового года или корпоратива.',
      media: [
        { type: 'video', src: 'bear_short.mp4' },
        { type: 'img', src: 'Мишка/IMG_3043.JPG' },
        { type: 'img', src: 'Мишка/IMG_3044.JPG' },
        { type: 'img', src: 'Мишка/IMG_3045.JPG' },
        { type: 'img', src: 'Мишка/IMG_3046.JPG' }
      ]
    },
    'panda': {
      name: 'Панда',
      desc: 'Весёлая и неуклюжая панда — любимица всех детей! Она придумает крутые игры, потанцует под зажигательную музыку и подарит кучу объятий.',
      media: [
        { type: 'video', src: 'panda_short.mp4' }
      ]
    },
    'kapibara': {
      name: 'Капибара',
      desc: 'Самый трендовый и спокойный герой! Капибара с мандаринами вызовет восторг и у детей, и у взрослых. Идеально для фотосессий и уютных праздников.',
      media: [
        { type: 'video', src: 'kapibara_short.mp4' }
      ]
    },
    'other': {
      name: 'Другие персонажи',
      desc: 'У нас есть не только мишки и капибары! Зайка, Лиса, Единорог и другие герои готовы приехать на ваш праздник.',
      media: []
    }
  };

  // Логика лайтбокса (глобальные функции)
  function openLightbox(src) {
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    lightboxImg.src = src;
    lightbox.classList.add('active');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
  }

  // Закрытие по клику на фон
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });

  // Загрузка контента
  const urlParams = new URLSearchParams(window.location.search);
  const charId = urlParams.get('id') || 'bear';
  const data = characters[charId];

  if (data) {
    document.title = data.name + ' на праздник в Нижнем Новгороде — Заказать ростовую куклу';
    document.getElementById('char-name').innerHTML = data.name + ' <br><span style="font-size: 0.6em; color: #64748b; display: block; margin-top: 10px;">на праздник в Нижнем Новгороде</span>';
    document.getElementById('char-desc').innerText = data.desc;
    
    const gallery = document.getElementById('char-gallery');
    data.media.forEach((item) => {
      let el;
      if (item.type === 'video') {
        el = document.createElement('video');
        el.src = item.src;
        el.autoplay = true;
        el.loop = true;
        el.muted = true;
        el.playsInline = true;
      } else {
        el = document.createElement('img');
        el.src = item.src;
        el.alt = data.name;
        // При клике на фото вызываем функцию увеличения
        el.onclick = function() { openLightbox(item.src); };
      }
      gallery.appendChild(el);
    });
  } else {
    document.getElementById('char-name').innerText = 'Персонаж не найден';
    document.getElementById('char-desc').innerText = 'Вернитесь на главную страницу и выберите героя.';
  }
</script>

</body>
</html>
