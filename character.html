<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказать персонажа на праздник в Нижнем Новгороде</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');
  
  :root {
    --primary: #0b6fa4;
    --accent: #ff7a1a;
    --accent-gradient: linear-gradient(135deg, #ff8c2b 0%, #ff5e00 100%);
    --bg-light: #f0f7fb;
    --text-main: #1a202c;
    --text-muted: #64748b;
  }

  @keyframes bgAnimation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  body { 
    font-family: 'Montserrat', sans-serif; 
    margin: 0; padding: 0; 
    background: linear-gradient(-45deg, #e0f2fe, #bae6fd, #f0f9ff, #e0f2fe);
    background-size: 400% 400%;
    animation: bgAnimation 20s ease infinite;
    color: var(--text-main); 
    text-align: center; 
  }

  header { 
    background: rgba(255, 255, 255, 0.85); 
    backdrop-filter: blur(15px);
    padding: 15px 30px; 
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
  }
  
  .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 10px; }
  
  .back-btn { 
    color: var(--primary); text-decoration: none; font-weight: 600; font-size: 15px; 
    display: flex; align-items: center; gap: 5px; transition: 0.3s;
  }
  .back-btn:hover { color: var(--accent); transform: translateX(-5px); }

  .container { max-width: 900px; margin: 0 auto; padding: 30px 15px; }
  
  .hero { 
    background: rgba(255, 255, 255, 0.98); 
    padding: 40px 25px; 
    border-radius: 30px; 
    box-shadow: 0 30px 60px -15px rgba(11, 111, 164, 0.15); 
    margin-bottom: 40px; 
    border: 1px solid rgba(255, 255, 255, 0.9);
  }

  h1 { color: var(--primary); font-size: 42px; margin: 0 0 15px 0; line-height: 1.15; font-weight: 900; }
  .description { color: var(--text-muted); font-size: 18px; margin-bottom: 30px; line-height: 1.6; }
  
  .gallery { 
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 40px; 
  }
  .gallery video, .gallery img { 
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
  }
  .gallery-item-full { grid-column: 1 / -1; aspect-ratio: 16 / 9 !important; }

  .btn-call { 
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; max-width: 400px; padding: 20px 30px; border-radius: 50px; 
    font-size: 20px; font-weight: 900; text-decoration: none; 
    background: var(--accent-gradient); color: white; 
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 15px 30px rgba(255, 94, 0, 0.3);
  }
  .btn-call:hover { transform: translateY(-5px) scale(1.03); box-shadow: 0 20px 40px rgba(255, 94, 0, 0.5); }

  @media (max-width: 600px) {
    .container { padding: 15px 10px; }
    .hero { padding: 25px 15px; border-radius: 20px; margin-bottom: 20px; }
    h1 { font-size: 28px; }
    .description { font-size: 14px; margin-bottom: 20px; }
    .gallery { gap: 10px; margin-bottom: 25px; }
    .gallery video, .gallery img { border-radius: 15px; }
    .btn-call { font-size: 16px; padding: 16px 20px; max-width: 100%; }
    .back-btn { font-size: 13px; }
    .logo { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">🐻 ПраздникНН</a>
  <a href="index.html" class="back-btn">← Назад на главную</a>
</header>

<div class="container">
  <div class="hero">
    <h1 id="char-name">Загрузка...</h1>
    <p class="description" id="char-desc">Пожалуйста, подождите...</p>
    
    <div class="gallery" id="char-gallery">
    </div>

    <a href="tel:+79085997498" class="btn-call">📞 Заказать этого персонажа</a>
  </div>
</div>

<script>
  const characters = {
    'bear': {
      name: 'Белый медведь',
      desc: 'Огромный, мягкий и невероятно обнимательный белый медведь! Он обожает танцевать, играть с детьми и делать потрясающие фото. Идеальный герой для дня рождения, Нового года или корпоратива.',
      media: [
        { type: 'video', src: 'bear_short.mp4' }
      ]
    },
    'panda': {
      name: 'Панда',
      desc: 'Весёлая и неуклюжая панда — любимица всех детей! Она придумает крутые игры, потанцует под зажигательную музыку и подарит кучу объятий.',
      media: [
        { type: 'video', src: 'panda_short.mp4' }
      ]
    },
    'kapibara': {
      name: 'Капибара',
      desc: 'Самый трендовый и спокойный герой! Капибара с мандаринами вызовет восторг и у детей, и у взрослых. Идеально для фотосессий и уютных праздников.',
      media: [
        { type: 'video', src: 'kapibara_short.mp4' }
      ]
    },
    'other': {
      name: 'Другие персонажи',
      desc: 'У нас есть не только мишки и капибары! Зайка, Лиса, Единорог и другие герои готовы приехать на ваш праздник.',
      media: []
    }
  };

  const urlParams = new URLSearchParams(window.location.search);
  const charId = urlParams.get('id') || 'bear';
  const data = characters[charId];

  if (data) {
    document.title = data.name + ' — Заказать на праздник в Нижнем Новгороде';
    document.getElementById('char-name').innerText = data.name;
    document.getElementById('char-desc').innerText = data.desc;
    
    const gallery = document.getElementById('char-gallery');
    data.media.forEach((item, index) => {
      let el;
      if (item.type === 'video') {
        el = document.createElement('video');
        el.src = item.src;
        el.autoplay = true;
        el.loop = true;
        el.muted = true;
        el.playsInline = true;
      } else {
        el = document.createElement('img');
        el.src = item.src;
        el.alt = data.name;
      }
      if (index === 0) el.classList.add('gallery-item-full');
      gallery.appendChild(el);
    });
  } else {
    document.getElementById('char-name').innerText = 'Персонаж не найден';
    document.getElementById('char-desc').innerText = 'Вернитесь на главную страницу и выберите героя.';
  }
</script>

</body>
</html>
