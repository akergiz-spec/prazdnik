<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Копытыч — Заказать персонажа в Нижнем Новгороде</title>
<meta name="yandex-verification" content="a27f4167e7a23814" />
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');
  
  :root {
    --primary: #0b6fa4;
    --accent: #ff7a1a;
    --accent-gradient: linear-gradient(135deg, #ff8c2b 0%, #ff5e00 100%);
    --bg-light: #f0f7fb;
    --text-main: #1a202c;
    --text-muted: #64748b;
  }

  body { 
    font-family: 'Montserrat', sans-serif; 
    margin: 0; padding: 0; 
    background-color: #eaf4fb;
    background-image: radial-gradient(#c3ddf0 2px, transparent 2px), radial-gradient(#c3ddf0 2px, transparent 2px);
    background-size: 50px 50px;
    background-position: 0 0, 25px 25px;
    color: var(--text-main); 
    text-align: center; 
    overflow-x: hidden;
  }

  header { 
    background: rgba(255, 255, 255, 0.7); 
    backdrop-filter: blur(20px);
    padding: 18px 5%; 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    border-bottom: 1px solid rgba(255,255,255,0.5);
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
  }
  
  .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
  .logo img { width: 32px; height: 32px; }
  
  .back-btn { color: var(--primary); text-decoration: none; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 5px; transition: 0.3s; }
  .back-btn:hover { color: var(--accent); transform: translateX(-5px); }

  .container { max-width: 1000px; margin: 0 auto; padding: 50px 5%; }
  
  .hero { 
    background: rgba(255, 255, 255, 0.95); 
    padding: 60px 40px; 
    border-radius: 40px; 
    box-shadow: 0 40px 100px -20px rgba(11, 111, 164, 0.2); 
    margin-bottom: 50px; 
    border: 1px solid rgba(255, 255, 255, 1);
  }

  h1 { color: var(--primary); font-size: 50px; margin: 0 0 20px 0; line-height: 1.1; font-weight: 900; letter-spacing: -1.5px; }
  .description { color: var(--text-muted); font-size: 19px; margin-bottom: 40px; line-height: 1.6; max-width: 800px; margin-left: auto; margin-right: auto; font-weight: 500; }
  
  /* НАВИГАЦИЯ МЕЖДУ ПЕРСОНАЖАМИ */
  .nav-arrows {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0;
    gap: 15px;
  }
  .nav-arrow {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: #fff;
    border: 2px solid rgba(11, 111, 164, 0.1);
    border-radius: 30px;
    color: var(--primary);
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.02);
  }
  .nav-arrow:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(11, 111, 164, 0.1);
  }

  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
  .gallery img, .gallery video { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); transition: all 0.3s ease; cursor: pointer; }
  .gallery img:hover, .gallery video:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 40px rgba(11, 111, 164, 0.2); }

  .btn-call { 
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; max-width: 450px; padding: 20px 30px; border-radius: 12px; 
    font-size: 18px; font-weight: 800; text-decoration: none; 
    background: var(--accent-gradient); 
    color: white; border: none; transition: all 0.2s ease;
    box-shadow: 0 10px 25px rgba(255, 94, 0, 0.3);
    margin: 0 auto;
    box-sizing: border-box;
  }
  .btn-call:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(255, 94, 0, 0.5); }
  .btn-call:active { transform: translateY(1px); box-shadow: 0 5px 15px rgba(255, 94, 0, 0.3); }

  /* ЛАЙТБОКС (Увеличение фото) */
  .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 95%; max-height: 85%; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: zoomIn 0.3s ease; }
  .lightbox-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 60px; cursor: pointer; font-weight: bold; line-height: 1; }
  
  /* СТРЕЛКИ В ЛАЙТБОКСЕ */
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.1); color: white; border: none;
    width: 60px; height: 60px; border-radius: 50%; font-size: 30px;
    cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
  }
  .lb-nav:hover { background: rgba(255,255,255,0.3); }
  .lb-prev { left: 20px; }
  .lb-next { right: 20px; }

  @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  @media (max-width: 600px) {
    .container { padding: 20px 10px; }
    .hero { padding: 30px 15px; border-radius: 30px; margin-bottom: 25px; }
    h1 { font-size: 28px; }
    .description { font-size: 15px; margin-bottom: 25px; }
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .gallery img, .gallery video { border-radius: 14px; }
    .btn-call { font-size: 16px; padding: 16px 20px; width: 100%; }
    .back-btn { font-size: 13px; }
    .logo { font-size: 18px; }
    header { padding: 15px 10px; }
    .nav-arrow { padding: 8px 12px; font-size: 12px; }
    .lb-nav { width: 40px; height: 40px; font-size: 20px; }
    .lb-prev { left: 10px; } .lb-next { right: 10px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo"><img src="favicon.svg" alt="Копытыч"> Копытыч</a>
  <a href="javascript:history.back()" class="back-btn">← Назад</a>
</header>

<div class="container">
  <div class="hero">
    <h1 id="char-name">Загрузка...</h1>
    <p class="description" id="char-desc">Пожалуйста, подождите...</p>
    
    <div class="gallery" id="char-gallery"></div>

    <div class="price-tag">
      <span class="price-label">Стоимость выступления:</span>
      <span class="price-value" id="char-price">от 4 500 ₽</span>
    </div>
    
    <a href="tel:+79085997498" class="btn-call">📞 Заказать этого персонажа</a>

    <!-- НАВИГАЦИЯ ВНИЗУ -->
    <div class="nav-arrows">
      <a href="#" class="nav-arrow" id="prev-btn">← Предыдущий</a>
      <a href="#" class="nav-arrow" id="next-btn">Следующий →</a>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <button class="lb-nav lb-prev" onclick="navigateLightbox(-1)">&#10094;</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lb-nav lb-next" onclick="navigateLightbox(1)">&#10095;</button>
</div>

<script>
    const characters = {
    'bear': {
      name: 'Белый медведь',
      price: 'от 4 500 ₽',
      desc: 'Огромный, мягкий и невероятно обнимательный белый медведь! Он обожает танцевать, играть с детьми и делать потрясающие фото. Идеальный герой для дня рождения, Нового года или корпоратива.',
      media: [
        { type: 'video', src: 'bear_short.mp4' },
        { type: 'img', src: 'Мишка/1.PNG' },
        { type: 'img', src: 'Мишка/2.PNG' },
        { type: 'img', src: 'Мишка/3.PNG' },
        { type: 'img', src: 'Мишка/4.PNG' }
      ]
    },
    'panda': {
      name: 'Панда',
      price: 'от 4 500 ₽',
      desc: 'Весёлая и неуклюжая панда — любимица всех детей! Она придумает крутые игры, потанцует под зажигательную музыку и подарит кучу объятий.',
      media: [
        { type: 'video', src: 'panda_short.mp4' },
        { type: 'img', src: 'панда/IMG_3060.PNG' },
        { type: 'img', src: 'панда/IMG_3061.PNG' },
        { type: 'img', src: 'панда/IMG_3062.PNG' },
        { type: 'img', src: 'панда/IMG_3063.PNG' }
      ]
    },
    'kapibara': {
      name: 'Капибара',
      price: 'от 4 500 ₽',
      desc: 'Самый трендовый и спокойный герой! Капибара с мандаринами вызовет восторг и у детей, и у взрослых. Идеально для фотосессий и уютных праздников.',
      media: [
        { type: 'video', src: 'kapibara_short.mp4' },
        { type: 'img', src: 'капибара/IMG_3051.PNG' },
        { type: 'img', src: 'капибара/IMG_3052.PNG' },
        { type: 'img', src: 'капибара/IMG_3057.PNG' },
        { type: 'img', src: 'капибара/IMG_3058.PNG' }
      ]
    },
    'artur': {
      name: 'Артур Пирожков',
      price: 'от 5 000 ₽',
      desc: 'Если вы хотите, чтобы гости забыли про свои проблемы и пустились в пляс — вам точно к нему! Он знает, как «Зацепить» каждого, и не боится стать «Алкоголичкой» на вашем празднике. Танцы до утра, юмор и море позитива — гарантированы. Идеально для корпоративов и свадеб.',
      media: [{ type: 'img', src: 'артур.JPG' }]
    },
    'stas': {
      name: 'Стас Михайлов',
      price: 'от 5 000 ₽',
      desc: 'Для тех, кто ценит душевную лирику и романтику. Он точно знает, что «Всё для тебя» в этот вечер, и подарит дамам настоящие эмоции. Прекрасный сюрприз для женщин на юбилее или свадьбе, который заставит сердца биться чаще.',
      media: [{ type: 'img', src: 'стас.JPG' }]
    },
    'sergey': {
      name: 'Сергей Жуков',
      price: 'от 5 000 ₽',
      desc: 'Ностальгия по 90-м и легендарные хиты, под которые невозможно усидеть на месте! Когда он выходит на сцену, даже самая скромная «Крошка моя» начинает танцевать. Взорвет любой танцпол и заставит всех петь хором на вашем мероприятии.',
      media: [{ type: 'img', src: 'сергей.JPG' }]
    }
  };

  const charIds = ['bear', 'panda', 'kapibara', 'artur', 'stas', 'sergey'];
  let currentCharId = 'bear';

  function loadCharacter(id) {
    currentCharId = id;
    const data = characters[id];
    if (!data) return;

    document.title = data.name + ' — Заказать в Нижнем Новгороде | Копытыч';
    document.getElementById('char-name').innerHTML = data.name + ' <br><span style="font-size: 0.5em; color: #64748b; display: block; margin-top: 10px; font-weight: 600;">на праздник в Нижнем Новгороде</span>';
    document.getElementById('char-desc').innerText = data.desc;
    document.getElementById('char-price').innerText = data.price;
    
    const gallery = document.getElementById('char-gallery');
    gallery.innerHTML = '';
    
    data.media.forEach((item) => {
      let el;
      if (item.type === 'video') {
        el = document.createElement('video');
        el.src = item.src;
        el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true;
      } else {
        el = document.createElement('img');
        el.src = item.src;
        el.alt = data.name;
        el.onclick = () => openLightbox(item.src);
      }
      gallery.appendChild(el);
    });

    // Настройка стрелок навигации
    const index = charIds.indexOf(id);
    const prevId = charIds[(index - 1 + charIds.length) % charIds.length];
    const nextId = charIds[(index + 1) % charIds.length];
    document.getElementById('prev-btn').href = 'character.html?id=' + prevId;
    document.getElementById('next-btn').href = 'character.html?id=' + nextId;
  }

  // ЛАЙТБОКС
  let currentMediaIndex = 0;
  function openLightbox(src) {
    const data = characters[currentCharId];
    const imageMedia = data.media.filter(m => m.type === 'img');
    currentMediaIndex = imageMedia.findIndex(m => m.src === src);
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('active');
  }
  
  function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
  
  function navigateLightbox(dir) {
    const data = characters[currentCharId];
    const imageMedia = data.media.filter(m => m.type === 'img');
    if (imageMedia.length <= 1) return;
    currentMediaIndex = (currentMediaIndex + dir + imageMedia.length) % imageMedia.length;
    document.getElementById('lightbox-img').src = imageMedia[currentMediaIndex].src;
  }

  document.getElementById('lightbox').addEventListener('click', function(e) { if (e.target === this) closeLightbox(); });

  // Загрузка при старте
  const urlParams = new URLSearchParams(window.location.search);
  const startId = urlParams.get('id') || 'bear';
  if (characters[startId]) loadCharacter(startId);
</script>

</body>
</html>
